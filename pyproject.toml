[project]
name = "qcconvert"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["qiskit", "qiskit-aer", "cudaq", "numpy"]

[project.optional-dependencies]
# 雙欄編輯器（show）與 cell magic 用；核心轉換 API 不需要。
colab = ["ipywidgets", "ipython"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 行＋分支（line + branch）覆蓋率門檻 100%；跑單一測試檔請加 --no-cov。
addopts = "--cov=qcconvert --cov-fail-under=100"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["cudaq", "cudaq.*", "qiskit", "qiskit.*", "qiskit_aer", "qiskit_aer.*", "ipywidgets", "IPython"]
ignore_missing_imports = true
